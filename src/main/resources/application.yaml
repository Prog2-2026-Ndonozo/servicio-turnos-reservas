spring:
  application:
    name: servicio-turnos-reservas

  config:
    import: optional:file:.env[.properties]   # carga el .env local; una variable de entorno real tiene prioridad

  datasource:
    url: jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5433}/${DB_NAME:turnos}
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}
  jpa:
    hibernate:
      ddl-auto: validate
  kafka:
    bootstrap-servers: ${CATEDRA_KAFKA}
    consumer:
      group-id: ${CATEDRA_KAFKA_CONSUMER_GROUP}
      auto-offset-reset: earliest
    producer:
      properties:
        # Con el broker caído, send() no se queda esperando el metadata 60 s: falla rápido y el caso de uso responde 503
        max.block.ms: 5000

springdoc:
  api-docs:
    enabled: false
  swagger-ui:
    enabled: false

server:
  port: ${SERVER_PORT:8081}


app:
  security:
    jwt:
      secret: ${JWT_SECRET}
      expiration: 24h
  catalog:
    base-url: ${CATALOGO_BASE_URL:http://localhost:8080}
    connect-timeout: ${CATALOGO_CONNECT_TIMEOUT:2s}
    read-timeout: ${CATALOGO_READ_TIMEOUT:5s}

    jwt:
      private-key-file: ${CATALOGO_PRIVATE_KEY_FILE}
      issuer: servicio-turnos
      audience: servicio-catalogo

  catedra:
    base-url: ${CATEDRA_BASE_URL}
    jwt: ${CATEDRA_JWT}
    connect-timeout: ${CATEDRA_CONNECT_TIMEOUT:2s}
    read-timeout: ${CATEDRA_READ_TIMEOUT:5s}
    group-id: ${CATEDRA_GROUP_ID}
    kafka:
      appointment-actions-topic: ${CATEDRA_KAFKA_APPOINTMENT_ACTIONS_TOPIC}
      appointment-phone-topic: ${CATEDRA_KAFKA_APPOINTMENT_PHONE_TOPIC}
  business-time-zone: ${BUSINESS_TIME_ZONE:America/Argentina/Buenos_Aires}
