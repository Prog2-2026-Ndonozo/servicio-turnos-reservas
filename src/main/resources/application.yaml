spring:
  application:
    name: servicio-turnos-reservas

  config:
    import: optional:file:.env[.properties]   # carga el .env local; una variable de entorno real tiene prioridad

  datasource:
    url: jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5433}/${DB_NAME:turnos}
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}
  jpa:
    hibernate:
      ddl-auto: validate

springdoc:
  api-docs:
    enabled: false
  swagger-ui:
    enabled: false

server:
  port: ${SERVER_PORT:8081}


app:
  security:
    jwt:
      secret: ${JWT_SECRET}
      expiration: 24h
  catalog:
    base-url: ${CATALOGO_BASE_URL:http://localhost:8080}
    connect-timeout: ${CATALOGO_CONNECT_TIMEOUT:2s}
    read-timeout: ${CATALOGO_READ_TIMEOUT:5s}
    jwt:
      private-key-file: ${CATALOGO_PRIVATE_KEY_FILE}
      issuer: servicio-turnos
      audience: servicio-catalogo
