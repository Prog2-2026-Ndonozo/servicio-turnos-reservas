services:
  postgres:
    image: postgres:16-alpine
    container_name: turnos_postgres
    environment:
      POSTGRES_DB: ${DB_NAME:-turnos}
      POSTGRES_USER: "${DB_USERNAME:?Falta DB_USERNAME en el .env (copiá .env.example)}"
      POSTGRES_PASSWORD: "${DB_PASSWORD:?Falta DB_PASSWORD en el .env (copiá .env.example)}"
    ports:
      - "${DB_PORT:-5433}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USERNAME} -d ${DB_NAME:-turnos}"]
      interval: 5s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  app:
    build: .
    container_name: turnos_app
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      DB_HOST: postgres
      DB_PORT: 5432
      DB_NAME: ${DB_NAME:-turnos}
      DB_USERNAME: "${DB_USERNAME:?Falta DB_USERNAME en el .env (copiá .env.example)}"
      DB_PASSWORD: "${DB_PASSWORD:?Falta DB_PASSWORD en el .env (copiá .env.example)}"
    ports:
      - "${APP_PORT:-8080}:8080"
    restart: unless-stopped

volumes:
  postgres_data: